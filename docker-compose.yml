services:
  app:
    build: .
    container_name: jiafen
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-jiafen123}
      SECRET_KEY: ${SECRET_KEY:-}
      PORT: "5000"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5002:5000"
    volumes:
      - ./application/data:/app/application/data
