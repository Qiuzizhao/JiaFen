<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>课堂小组积分</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260915">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=20260915">
  <link rel="icon" href="/favicon.ico?v=20260915" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260915">
  <link rel="stylesheet" href="/style.css?v=20260920c">
</head>
<body>

  <!-- 登录 -->
  <div id="login" class="hidden">
    <div class="login-box">
      <h1>课堂小组积分</h1>
      <div id="login-form">
        <p class="muted">请输入用户名和密码</p>
        <input type="text" id="login-name" placeholder="用户名" autocomplete="username" spellcheck="false" autocapitalize="off">
        <input type="password" id="login-pw" placeholder="密码" autocomplete="current-password">
        <button id="login-btn" class="primary">进入</button>
        <p class="muted small">还没有账号？<a href="#" id="show-register">注册</a></p>
      </div>
      <div id="register-form" class="hidden">
        <p class="muted">注册新账号</p>
        <input type="text" id="reg-name" placeholder="用户名" spellcheck="false" autocapitalize="off">
        <input type="password" id="reg-pw" placeholder="密码（至少 4 位）" autocomplete="new-password">
        <button id="register-btn" class="primary">注册并进入</button>
        <p class="muted small"><a href="#" id="show-login">返回登录</a></p>
      </div>
      <p id="login-err" class="err"></p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand">课堂小组积分 <span id="sync-status" class="sync-status syncing" title="正在连接实时同步">同步中…</span></div>
      <div class="actions">
        <button id="btn-classes" class="ghost">班级</button>
        <button id="btn-export" class="ghost">导出备份</button>
        <button id="btn-import" class="ghost">导入备份</button>
        <button id="btn-voice" class="ghost" title="语音播报开关">🔈 语音播报</button>
        <button id="btn-projector" class="ghost">投屏模式</button>
        <button id="btn-account" class="ghost who-btn" title="账号设置">👤 <span id="who"></span></button>
        <button id="btn-logout" class="ghost danger-ghost">退出</button>
      </div>
    </header>
    <input type="file" id="import-file" accept="application/json,.json" class="hidden">

    <div class="layout">
      <!-- 侧栏：班级 -->
      <aside class="sidebar">
        <div class="panel-head">班级 <button id="btn-class-close" class="icon-btn class-close" aria-label="关闭">✕</button></div>
        <div class="new-class">
          <input type="text" id="class-name" placeholder="新建班级…">
          <button id="btn-add-class" class="primary">＋</button>
        </div>
        <div id="class-list" class="class-list"></div>
      </aside>

      <!-- 主区：记分板 -->
      <main class="main">
        <div class="board-head">
          <h2 id="current-class-name" class="board-title">请选择班级</h2>
          <div class="board-actions">
            <button id="btn-roster" class="ghost">📋 班级名单</button>
            <button id="btn-add-group" class="ghost">＋ 添加小组</button>
            <button id="btn-reset" class="ghost danger-ghost">清零本班分数</button>
          </div>
        </div>
        <select id="mobile-class-select" class="mobile-class-select" aria-label="切换班级"></select>
        <div id="class-score" class="class-score disabled" title="给本班每个小组同时加减分">
          <span class="cs-label">全班</span>
          <div class="cs-quick">
            <button class="qbtn up" onclick="addClassScore(1)">+1</button>
            <button class="qbtn up" onclick="addClassScore(2)">+2</button>
            <button class="qbtn up" onclick="addClassScore(5)">+5</button>
            <button class="qbtn down" onclick="addClassScore(-1)">-1</button>
            <button class="qbtn down" onclick="addClassScore(-2)">-2</button>
            <button class="qbtn down" onclick="addClassScore(-5)">-5</button>
          </div>
          <div class="cs-custom">
            <input type="number" id="class-amount" class="amount" placeholder="分值">
            <button id="btn-class-score">记分</button>
          </div>
        </div>
        <div id="board" class="board"></div>
      </main>

      <!-- 右侧：排行 + 记录 -->
      <aside class="right">
        <div class="panel">
          <div class="panel-head">
            排行榜
            <div class="lb-toggle" id="lb-toggle">
              <button id="lb-class-btn" class="on">全班</button>
              <button id="lb-school-btn">全校</button>
              <button id="lb-classes-btn">班级</button>
            </div>
          </div>
          <div id="leaderboard" class="leaderboard"></div>
        </div>
        <div class="panel">
          <div class="panel-head">
            记分记录
            <button id="btn-undo" class="ghost" style="margin-left:auto;">撤销上一条</button>
          </div>
          <div id="history" class="history"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- 移动端班级弹窗背景 -->
  <div id="class-backdrop" class="class-backdrop"></div>

  <!-- 清零确认弹窗 -->
  <div id="reset-modal" class="modal hidden">
    <div class="modal-box">
      <h3>清零本班分数</h3>
      <p>请输入你自己的登录密码，确认清零「<span id="reset-class-name"></span>」所有小组分数。此操作不可撤销。</p>
      <input type="password" id="reset-pw" placeholder="登录密码" autocomplete="off">
      <p id="reset-err" class="err"></p>
      <div class="modal-actions">
        <button id="reset-cancel" class="ghost">取消</button>
        <button id="reset-confirm" class="primary danger">确认清零</button>
      </div>
    </div>
  </div>

  <!-- 班级名单 -->
  <div id="roster-modal" class="modal hidden">
    <div class="modal-box roster-box">
      <div class="modal-head">
        <h3>班级名单 <span id="roster-sub" class="roster-sub"></span></h3>
        <button id="roster-close" class="icon-btn" aria-label="关闭">✕</button>
      </div>
      <div class="roster-tools">
        <label class="roster-search">
          <span aria-hidden="true">🔍</span>
          <input id="roster-search" type="text" placeholder="查找学生，输入姓氏即可定位" autocomplete="off">
        </label>
        <button id="roster-import-btn" class="ghost">批量导入</button>
        <button id="roster-export-btn" class="ghost">导出名单</button>
      </div>
      <div id="roster-quick" class="roster-quick">
        <div id="roster-chips" class="rq-chips"></div>
        <div class="rq-row">
          <input id="stu-new-name" placeholder="输入姓名，回车就加进小组" maxlength="20" autocomplete="off" enterkeyhint="done">
          <button id="roster-add-btn" class="primary" type="button">添加</button>
        </div>
        <div class="rq-hint">
          <button id="roster-undo" class="rq-undo hidden" type="button">撤销上一个</button>
        </div>
      </div>
      <p id="roster-msg" class="hint"></p>
      <!-- 批量导入面板：小组卡片上的「批量导入」和顶部的「批量导入」都进这里 -->
      <div id="roster-import" class="roster-import-panel hidden" role="dialog" aria-label="批量导入到小组">
        <div class="ri-head" id="ri-head"></div>
        <div class="ri-steps" id="ri-steps" role="group" aria-label="导入步骤"></div>
        <div class="ri-body" id="ri-body"></div>
        <div class="ri-foot" id="ri-foot"></div>
      </div>
      <div class="roster-main">
        <nav id="roster-nav" class="roster-nav" aria-label="快速跳转"></nav>
        <div id="roster-body" class="roster-body"></div>
      </div>
      <p class="roster-foot">按住学生左边的 ⠿ 拖动可以换组；点右边的 ⋯ 能改名 / 换组 / 删除。</p>
    </div>
  </div>

  <!-- 账号弹窗 -->
  <div id="account-modal" class="modal hidden">
    <div class="modal-box wide">
      <div class="modal-head">
        <h3>账号</h3>
        <button id="account-close" class="icon-btn" aria-label="关闭">✕</button>
      </div>
      <p class="muted" id="account-me"></p>
      <h4 class="modal-sub">显示名</h4>
      <div class="pw-row">
        <input type="text" id="profile-name" placeholder="顶栏显示的名字" maxlength="20">
        <button id="profile-save" class="primary">保存</button>
      </div>
      <h4 class="modal-sub">修改我的密码</h4>
      <div class="pw-row">
        <input type="password" id="pw-old" placeholder="当前密码" autocomplete="off">
        <input type="password" id="pw-new" placeholder="新密码（至少 4 位）" autocomplete="off">
        <button id="pw-save" class="primary">保存</button>
      </div>
      <p id="account-err" class="hint"></p>
    </div>
  </div>

  <!-- 投屏模式 -->
  <div id="projector" class="hidden">
    <div class="proj-tools">
      <button id="projector-voice" class="close-btn">🔈 语音：关</button>
      <button id="projector-close" class="close-btn">✕ 退出投屏</button>
    </div>
    <div class="projector-title" id="projector-title">课堂小组积分</div>
    <div id="projector-board" class="projector-board"></div>
  </div>

  <script src="/app.js?v=20260920c"></script>
</body>
</html>
